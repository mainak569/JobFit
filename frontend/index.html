<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      WHY darkreader-lock: the design is light-only on purpose, with the score
      gauge, skill chips and coverage bars built from specific colours. The
      Dark Reader extension rewrites those colours and made the gauge number
      almost invisible. This meta tag is Dark Reader's documented opt-out for
      sites that manage their own colours.
    -->
    <meta name="darkreader-lock" />
    <meta name="description" content="Check how well a resume matches a job description: matched skills, gaps, and what to change." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>JobFit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
